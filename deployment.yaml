
apiVersion: apps/v1
kind: Deployment
metadata:
  name: findit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: findit
  template:
    metadata:
      labels:
        app: findit
    spec:
      containers:
        - name: findit
          image: naveenkumar31/findit:1.0
          ports:
            - containerPort: 80
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: findit-service
spec:
  type: NodePort
  selector:
    app: findit
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30007
